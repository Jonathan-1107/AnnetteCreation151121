<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#E8DFD0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Candle jar -->
  <g transform="translate(400,430)">
    <!-- jar body -->
    <rect x="-70" y="-40" width="140" height="160" rx="10" fill="#FFFFFF" fill-opacity="0.55" stroke="#B8A88F" stroke-width="2"/>
    <!-- jar lid -->
    <rect x="-78" y="-58" width="156" height="24" rx="6" fill="#C9B896"/>
    <!-- wax surface -->
    <ellipse cx="0" cy="-40" rx="66" ry="8" fill="#EDE3D0"/>
    <!-- wick -->
    <line x1="0" y1="-40" x2="0" y2="-78" stroke="#7A6A52" stroke-width="3" stroke-linecap="round"/>
    <!-- flame -->
    <path d="M0,-78 C10,-95 -6,-108 0,-125 C6,-108 -10,-95 0,-78 Z" fill="#D9A05B" opacity="0.85"/>
  </g>

  <text x="400" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#8A7B63" text-anchor="middle" letter-spacing="2">
    IMAGE COMING SOON
  </text>
</svg>
